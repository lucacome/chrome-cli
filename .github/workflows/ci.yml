name: CI

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: ${{ github.ref_name }}-ci
  cancel-in-progress: true

env:
  BINARY_NAME: chrome-cli

jobs:
  build:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Create/Update Draft
        uses: lucacome/draft-release@3c9a48ffbf0dfe983aea7e3cd8d524965f25e1a8 # v2
        with:
          minor-label: "enhancement"
          major-label: "change"
          publish: ${{ github.ref_type == 'tag' }}
          collapse-after: 30
        if: github.event_name != 'pull_request'

      - name: Show toolchain
        run: swift --version

      - name: Test
        run: make test

      - name: Build binary
        if: github.ref_type != 'tag'
        run: make build

      - name: Build release binary
        if: github.ref_type == 'tag'
        run: make release

      - name: Package release artifact
        id: artifact
        shell: bash
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          TAG="${TAG:-${GITHUB_REF_NAME:-${GITHUB_REF##*/}}}"
          mkdir -p dist
          cp ".build/release/${BINARY_NAME}" "dist/${BINARY_NAME}"
          cp -R scripts "dist/scripts"
          chmod +x "dist/${BINARY_NAME}"
          chmod +x dist/scripts/*-cli
          TAR_NAME="${BINARY_NAME}-${TAG}-macos.tar.gz"
          tar -C dist -czf "dist/${TAR_NAME}" "${BINARY_NAME}" "scripts"
          shasum -a 256 "dist/${TAR_NAME}" > "dist/${BINARY_NAME}-${TAG}-macos.sha256.txt"

      - name: Upload binaries on release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        if: github.ref_type == 'tag'
        run: |
          gh release upload ${{ github.ref_name }} dist/*.tar.gz dist/*.sha256.txt --clobber

      - name: Update Homebrew formula
        uses: dawidd6/action-homebrew-bump-formula@1446dca236b0440c6f02723a3f14f13be2c04ab0 # v7
        if: github.ref_type == 'tag'
        with:
          token: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
          tap: lucacome/homebrew-tap
          formula: ${{ env.BINARY_NAME }}
